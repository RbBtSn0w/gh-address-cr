name: Release
run-name: ${{ inputs.operation == 'recover' && format('Recover release · run {0}', inputs.source_run_id) || format('Release main · {0}', github.event_name == 'schedule' && 'scheduled' || 'manual') }}
on:
  schedule:
    - cron: '0 7 * * 5'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [release, recover]
        default: release
        description: Release current main, or complete an original release
      source_run_id:
        type: string
        description: Original release run ID — required only for recover
      artifact_id:
        type: string
        description: Original recovery artifact ID — copy from Release outcome
permissions:
  actions: read
  contents: read
env:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://telemetry-gateway-development.hamiltonsnow.workers.dev/v1/traces
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  verify:
    name: Analyze and validate candidate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.operation != 'recover')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      analysis_artifact_id: ${{ steps.analysis_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reject full release reruns before analysis or builds
        run: |
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo '::error::Open the original Release outcome and recover its sealed identity, or dispatch a new release for current main. Full reruns cannot reanalyze after possible publication.'
            echo "Original outcome: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
      - name: Install verification tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check candidate source
        env:
          CANDIDATE: ${{ github.sha }}
        run: bash scripts/release/check-main.sh "$CANDIDATE"
      - name: Analyze exact candidate
        id: plan
        run: |
          mkdir -p dist
          node .github/release-train/cli.mjs analyze --output dist/plan.json
      - name: Install exact candidate verification dependencies
        if: steps.plan.outputs.released == 'true'
        run: python -m pip install -e '.[dev]' build twine
      - name: Verify product
        if: steps.plan.outputs.released == 'true'
        run: |
          ruff check src tests scripts/build_plugin_payload.py scripts/release
          python scripts/check_mypy_ratchet.py
          python -m unittest discover -s tests
          python -m gh_address_cr --help
          python -m gh_address_cr agent manifest
          node --test tests/branch_release_analysis.test.mjs tests/release_engine.test.mjs tests/release_observation.test.mjs tests/release_outcome_v2.test.mjs tests/release_platform_observation.test.mjs tests/release_train_cli.test.mjs
          node .github/release-train/sync.mjs check --consumer .
      - name: Build final release bytes without publisher authority
        if: steps.plan.outputs.released == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
          CANDIDATE: ${{ github.sha }}
        run: |
          python scripts/set_package_version.py --version "$PACKAGE_VERSION"
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m scripts.release.plugin_release prepare --directory dist/plugin-release --version "$PACKAGE_VERSION" --candidate "$CANDIDATE"
          python scripts/release/render_homebrew_formula.py --version "$PACKAGE_VERSION" --sdist-path dist/gh_address_cr-"$PACKAGE_VERSION".tar.gz --output "$RUNNER_TEMP/gh-address-cr.rb"
          python scripts/release/verify-package.py "$PACKAGE_VERSION"
          python -m venv "$RUNNER_TEMP/installed-release"
          "$RUNNER_TEMP/installed-release/bin/pip" install dist/*.whl
          GH_ADDRESS_CR_TEST_RUNTIME=installed "$RUNNER_TEMP/installed-release/bin/python" -m unittest tests.contract.test_installed_runtime_smoke_contract tests.contract.test_agent_journey_contract
          node .github/release-train/cli.mjs seal
      - uses: actions/upload-artifact@v4
        id: artifact
        if: steps.plan.outputs.released == 'true'
        with:
          name: release-main-verified-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - name: Retain read-only analysis
        id: analysis_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-analysis-${{ github.run_attempt }}
          path: dist/plan.json
          if-no-files-found: warn
  recovery-input:
    name: Validate original recovery
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'recover'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.candidate_sha }}
      version: ${{ steps.plan.outputs.version }}
      artifact_id: ${{ inputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-homebrew-helper
      - name: Validate recovery IDs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Copy original run and recovery artifact IDs from Release outcome.'
            exit 1
          fi
      - name: Bind original run and immutable artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/source-artifact.json"
          node .github/release-train/recovery-source.mjs --run "$RUNNER_TEMP/source-run.json" --artifact "$RUNNER_TEMP/source-artifact.json" --repository "$GITHUB_REPOSITORY" --source-run-id "$SOURCE_RUN_ID" --artifact-id "$ARTIFACT_ID" > "$RUNNER_TEMP/recovery-source.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/source-artifact.zip"
          node --input-type=module -e 'import {readFileSync} from "node:fs";import {createHash} from "node:crypto";const p=process.env.RUNNER_TEMP,m=JSON.parse(readFileSync(p+"/source-artifact.json"));if(!m.name.startsWith("release-main-verified-")||m.digest!=="sha256:"+createHash("sha256").update(readFileSync(p+"/source-artifact.zip")).digest("hex"))throw Error("Original verified artifact name/digest mismatch")'
          python3 scripts/release/check_artifact_zip.py "$RUNNER_TEMP/source-artifact.zip"
          node -e 'const fs=require("fs"),s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/recovery-source.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"candidate_sha="+s.candidate_sha+"\n")'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: verified
      - name: Validate original sealed plan and existing tag
        id: plan
        env:
          CANDIDATE: ${{ steps.source.outputs.candidate_sha }}
          PYTHONPATH: src
        run: |
          python -c 'import os; from pathlib import Path; from scripts.release.handoff import verify; from scripts.release.recovery import verify_tag; p=verify(Path("verified"),os.environ["CANDIDATE"]); verify_tag("RbBtSn0w/gh-address-cr","v"+p["version"],p["candidate"]); Path(os.environ["GITHUB_OUTPUT"]).write_text("version="+p["version"]+"\n")'
  publish:
    name: Publish GitHub release
    needs: [verify, recovery-input]
    if: always() && vars.RELEASE_ENABLED == 'true' && ((needs.verify.result == 'success' && needs.verify.outputs.released == 'true') || needs.recovery-input.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.operation == 'recover' && github.sha || needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-homebrew-helper
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.recovery-input.outputs.artifact_id || needs.verify.outputs.artifact_id }}
          run-id: ${{ inputs.operation == 'recover' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist
      - name: Verify handoff and live main then publish prebuilt bytes
        if: inputs.operation != 'recover'
        env:
          CANDIDATE: ${{ needs.recovery-input.outputs.source_sha || needs.verify.outputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.release.handoff verify --candidate "$CANDIDATE"
          bash scripts/release/check-main.sh "$CANDIDATE"
          node .github/release-train/cli.mjs publish
      - name: Recover only missing GitHub assets under original tag
        if: inputs.operation == 'recover'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/release-train/cli.mjs recover
  publish-pypi:
    name: Publish PyPI
    outputs:
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    needs: [verify, recovery-input, publish]
    if: always() && needs.publish.result == 'success' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.operation == 'recover' && github.sha || needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-homebrew-helper
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.recovery-input.outputs.artifact_id || needs.verify.outputs.artifact_id }}
          run-id: ${{ inputs.operation == 'recover' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: verified
      - name: Verify handoff and stage only missing PyPI files
        id: stage
        env:
          OPERATION: ${{ inputs.operation }}
          CANDIDATE: ${{ needs.recovery-input.outputs.source_sha || needs.verify.outputs.source_sha }}
        run: |
          python -m scripts.release.pypi_reconcile stage --directory verified --candidate "$CANDIDATE" --output dist --receipt "$RUNNER_TEMP/pypi-receipt.json"
          if [ "$OPERATION" = recover ]; then
            python -c 'import os; from scripts.release.recovery import verify_tag; from scripts.release.handoff import verify; from pathlib import Path; p=verify(Path("verified"),os.environ["CANDIDATE"]); verify_tag("RbBtSn0w/gh-address-cr","v"+p["version"],p["candidate"])'
          else
            bash scripts/release/check-main.sh "$CANDIDATE"
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.stage.outputs.missing == 'true'
        with:
          packages-dir: dist
      - name: Read back exact per-file publication results
        if: always() && steps.stage.outcome == 'success'
        env:
          CANDIDATE: ${{ needs.recovery-input.outputs.source_sha || needs.verify.outputs.source_sha }}
        run: python -m scripts.release.pypi_reconcile confirm --directory verified --candidate "$CANDIDATE" --receipt "$RUNNER_TEMP/pypi-receipt.json"
      - name: Preserve per-file PyPI receipt
        id: receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pypi-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pypi-receipt.json
          if-no-files-found: warn
  publish-homebrew:
    name: Publish Homebrew
    needs: [verify, recovery-input, publish-pypi]
    if: always() && needs.publish-pypi.result == 'success' && vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/homebrew.yml
    permissions:
      actions: read
      contents: write
    with:
      version: ${{ needs.recovery-input.outputs.version || needs.verify.outputs.version }}
      source_sha: ${{ needs.recovery-input.outputs.source_sha || needs.verify.outputs.source_sha }}
      rebuild: '0'
      operation: ${{ inputs.operation || 'release' }}
    secrets: inherit
  publish-plugin-marketplace:
    name: Publish Marketplace
    outputs:
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    needs: [verify, recovery-input, publish-pypi]
    if: always() && needs.publish-pypi.result == 'success' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: plugin-marketplace-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.operation == 'recover' && github.sha || needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-homebrew-helper
      - name: Install verified runtime without running source build hooks
        run: |
          python -m pip install --only-binary=:all: 'PyYAML>=6' packaging
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.recovery-input.outputs.artifact_id || needs.verify.outputs.artifact_id }}
          run-id: ${{ inputs.operation == 'recover' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist
      - name: Verify and publish immutable plugin bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.recovery-input.outputs.source_sha || needs.verify.outputs.source_sha }}
          PACKAGE_VERSION: ${{ needs.recovery-input.outputs.version || needs.verify.outputs.version }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python -c 'import os; from pathlib import Path; from scripts.release.handoff import verify; verify(Path("dist"),os.environ["CANDIDATE"])'
          if [ "$OPERATION" != recover ]; then bash scripts/release/check-main.sh "$CANDIDATE"; fi
          python -m scripts.release.plugin_release publish --directory dist/plugin-release --version "$PACKAGE_VERSION" --receipt "$RUNNER_TEMP/marketplace-receipt.json"

      - name: Retain Marketplace remote receipt
        id: receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/marketplace-receipt.json
          if-no-files-found: warn

  result:
    name: Release outcome
    permissions:
      contents: read
      actions: read
    needs: ['verify', 'recovery-input', 'publish', 'publish-pypi', 'publish-homebrew', 'publish-plugin-marketplace']
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Restore original analysis by producer ID
        id: analysis
        if: needs.verify.outputs.analysis_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.analysis_artifact_id }}
          merge-multiple: true
          path: result-input
      - name: Restore original verified payload and handoff
        id: verified
        if: needs.recovery-input.outputs.artifact_id != '' || needs.verify.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.recovery-input.outputs.artifact_id || needs.verify.outputs.artifact_id }}
          run-id: ${{ inputs.operation == 'recover' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: result-input
      - name: Restore PyPI per-file remote receipt
        id: pypi_receipt
        if: needs.publish-pypi.outputs.receipt_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-pypi.outputs.receipt_artifact_id }}
          merge-multiple: true
          path: publication-input
      - name: Restore Homebrew remote receipt
        id: homebrew_receipt
        if: needs.publish-homebrew.outputs.receipt_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-homebrew.outputs.receipt_artifact_id }}
          merge-multiple: true
          path: publication-input
      - name: Restore Marketplace remote receipt
        id: marketplace_receipt
        if: needs.publish-plugin-marketplace.outputs.receipt_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-plugin-marketplace.outputs.receipt_artifact_id }}
          merge-multiple: true
          path: publication-input
      - name: Read back GitHub identity and original payload bytes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          ORIGINAL_RUN_ID: ${{ inputs.operation == 'recover' && inputs.source_run_id || github.run_id }}
          RECOVERY_ARTIFACT_ID: ${{ needs.recovery-input.outputs.artifact_id || needs.verify.outputs.artifact_id }}
        run: node scripts/release/observe-platforms.mjs
      - name: Record independent verification and publication results
        if: always()
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RELEASE_TARGETS: '{"github": "publish", "pypi": "publish-pypi", "homebrew": "publish-homebrew", "marketplace": "publish-plugin-marketplace"}'
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REPORT_DOWNLOADS: ${{ toJSON(steps) }}
        run: node .github/release-train/cli.mjs report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-result-${{ github.run_attempt }}
          path: |
            release-result.json
            publication-input/*.json
          if-no-files-found: error
