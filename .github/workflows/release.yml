name: Release
on:
  schedule:
    - cron: '0 7 * * 5'
  workflow_dispatch:
permissions:
  contents: read
env:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://telemetry-gateway-development.hamiltonsnow.workers.dev/v1/traces
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  verify:
    if: vars.RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install -e '.[dev]' build twine
      - name: Check candidate source
        env:
          CANDIDATE: ${{ github.sha }}
        run: bash scripts/release/check-main.sh "$CANDIDATE"
      - name: Verify product
        run: |
          ruff check src tests scripts/build_plugin_payload.py scripts/release
          python scripts/check_mypy_ratchet.py
          python -m unittest discover -s tests
          python -m gh_address_cr --help
          python -m gh_address_cr agent manifest
          node --test tests/branch_release_analysis.test.mjs tests/release_engine.test.mjs
      - name: Analyze exact candidate
        id: plan
        run: |
          mkdir -p dist
          node scripts/release/engine.mjs plan dist/plan.json
      - name: Build final release bytes without publisher authority
        if: steps.plan.outputs.released == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
          CANDIDATE: ${{ github.sha }}
        run: |
          python scripts/set_package_version.py --version "$PACKAGE_VERSION"
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m scripts.release.plugin_release prepare --directory dist/plugin-release --version "$PACKAGE_VERSION" --candidate "$CANDIDATE"
          python scripts/release/render_homebrew_formula.py --version "$PACKAGE_VERSION" --sdist-path dist/gh_address_cr-"$PACKAGE_VERSION".tar.gz --output "$RUNNER_TEMP/gh-address-cr.rb"
          python scripts/release/verify-package.py "$PACKAGE_VERSION"
          python -m venv "$RUNNER_TEMP/installed-release"
          "$RUNNER_TEMP/installed-release/bin/pip" install dist/*.whl
          GH_ADDRESS_CR_TEST_RUNTIME=installed "$RUNNER_TEMP/installed-release/bin/python" -m unittest tests.contract.test_installed_runtime_smoke_contract tests.contract.test_agent_journey_contract
          python -m scripts.release.handoff record --candidate "$CANDIDATE"
      - uses: actions/upload-artifact@v4
        id: artifact
        if: steps.plan.outputs.released == 'true'
        with:
          name: release-main-verified-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
  publish:
    needs: verify
    if: needs.verify.outputs.released == 'true' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Verify handoff and live main then publish prebuilt bytes
        env:
          CANDIDATE: ${{ needs.verify.outputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.release.handoff verify --candidate "$CANDIDATE"
          bash scripts/release/check-main.sh "$CANDIDATE"
          node scripts/release/engine.mjs publish dist/plan.json
  publish-pypi:
    needs: [verify, publish]
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: verified
      - name: Verify handoff and stage only missing PyPI files
        id: stage
        env:
          CANDIDATE: ${{ needs.verify.outputs.source_sha }}
        run: |
          python -m scripts.release.pypi_reconcile stage --directory verified --candidate "$CANDIDATE" --output dist --receipt "$RUNNER_TEMP/pypi-receipt.json"
          bash scripts/release/check-main.sh "$CANDIDATE"
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.stage.outputs.missing == 'true'
        with:
          packages-dir: dist
      - name: Read back exact per-file publication results
        if: always() && steps.stage.outcome == 'success'
        env:
          CANDIDATE: ${{ needs.verify.outputs.source_sha }}
        run: python -m scripts.release.pypi_reconcile confirm --directory verified --candidate "$CANDIDATE" --receipt "$RUNNER_TEMP/pypi-receipt.json"
      - name: Preserve per-file PyPI receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pypi-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pypi-receipt.json
          if-no-files-found: warn
  publish-homebrew:
    needs: [verify, publish-pypi]
    if: vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/homebrew.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.verify.outputs.version }}
      source_sha: ${{ needs.verify.outputs.source_sha }}
      rebuild: '0'
    secrets: inherit
  publish-plugin-marketplace:
    needs: [verify, publish-pypi]
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: plugin-marketplace-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verified runtime without running source build hooks
        run: |
          python -m pip install --only-binary=:all: 'PyYAML>=6' packaging
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Verify and publish immutable plugin bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.verify.outputs.source_sha }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m scripts.release.handoff verify --candidate "$CANDIDATE"
          python -m pip install --only-binary=:all: dist/*.whl
          bash scripts/release/check-main.sh "$CANDIDATE"
          python -m scripts.release.plugin_release publish --directory dist/plugin-release --version "$PACKAGE_VERSION"
