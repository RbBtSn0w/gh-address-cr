name: PR Target Branch

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  validate-base:
    name: Validate base branch
    runs-on: ubuntu-latest
    steps:
      - name: Check target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${BASE_REF}" = "main" ]; then
            if [ "${HEAD_REF}" = "develop" ]; then
              echo "Allowing release PR: develop -> main"
              exit 0
            fi
            echo "::error::PRs directly targeting 'main' are not allowed. Please change the base branch to 'develop'."
            exit 1
          fi
          echo "Base branch '${BASE_REF}' is allowed."
