name: PR wheel preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

jobs:
  verify-ci:
    name: Require successful Python CI for the PR head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: ci
        with:
          script: |
            const { owner, repo } = context.repo;
            const { head, number } = context.payload.pull_request;
            const actions = github.rest.actions;
            const { data: preview } = await actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const created = Date.parse(preview.created_at);
            if (!Number.isFinite(created)) throw new Error('Missing preview event time');
            // The two workflows are independently queued by the same PR event.
            for (let attempt = 0; attempt < 52; attempt += 1) {
              const { data: { workflow_runs } } = await actions.listWorkflowRuns({
                owner, repo, workflow_id: 'ci.yml', event: 'pull_request',
                head_sha: head.sha, per_page: 30,
              });
              const run = workflow_runs.find(candidate =>
                candidate.head_sha === head.sha && candidate.head_branch === head.ref &&
                candidate.head_repository?.id === head.repo.id &&
                Math.abs(Date.parse(candidate.created_at) - created) <= 120000 &&
                (candidate.pull_requests.length === 0 ||
                 candidate.pull_requests.some(pr => pr.number === number && pr.base.ref === 'main')),
              );
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Python CI failed for this PR head');
                core.setOutput('run-id', run.id);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Timed out waiting for the matching Python CI run');

  pr-preview:
    name: PR preview package
    needs: verify-ci
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: preview-source
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      CHECKS_RUN_ID: ${{ needs.verify-ci.outputs.run-id }}
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: preview-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: preview-tools
          sparse-checkout: |
            scripts/release
            scripts/set_package_version.py
            src/gh_address_cr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install build 'packaging>=24' 'requests>=2.31'
          'opentelemetry-sdk>=1.40' 'opentelemetry-exporter-otlp-proto-http>=1.40'
      - name: Pack and verify the exact PR head
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          preview="$RUNNER_TEMP/pr-preview"
          mkdir "$preview"
          tools="$GITHUB_WORKSPACE/preview-tools"
          export PYTHONPATH="$tools:$tools/src"
          helper="$tools/scripts/release/pr_preview.py"
          version="$(python "$helper" version "$preview")"
          python "$tools/scripts/set_package_version.py" --version "$version" \
            --pyproject pyproject.toml --init-file src/gh_address_cr/__init__.py
          python -m build --wheel --outdir "$preview"
          python "$helper" seal "$preview" --version "$version"
          wheel="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["file"])' "$preview/receipt.json")"
          consumer="$(mktemp -d "$RUNNER_TEMP/preview-consumer.XXXXXX")"
          cp -R tests "$consumer/tests"
          # The existing negative test explicitly adds this path in its poisoned subprocess.
          ln -s "$PWD/src" "$consumer/src"
          (
            cd "$consumer"
            unset PYTHONPATH PYTHONHOME
            python -m venv venv
            venv/bin/python -m pip install "$preview/$wheel"
            test "$(venv/bin/gh-address-cr --version)" = "gh-address-cr $version"
            venv/bin/gh-address-cr --help
            GH_ADDRESS_CR_TEST_RUNTIME=installed venv/bin/python -m unittest \
              tests.contract.test_installed_runtime_smoke_contract tests.contract.test_agent_journey_contract
          )
          python "$helper" verify "$preview"
          ARTIFACT_ID=99999999999999 python "$helper" card "$preview" > "$preview/card.md"
      - name: Upload verified preview
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Show wheel verification commands
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: sed "s/99999999999999/$ARTIFACT_ID/g" "$RUNNER_TEMP/pr-preview/card.md" | tee -a "$GITHUB_STEP_SUMMARY"

  pr-preview-comment:
    name: Update the PR preview card
    needs: pr-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-preview-card-${{ github.event.pull_request.number }}
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Locate the successful upload
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = Number(process.env.SOURCE_RUN_ID);
            if (!/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ID) || !Number.isSafeInteger(run_id)) {
              throw new Error('Invalid source run ID');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.path?.split('@', 1)[0] !== '.github/workflows/pr-preview.yml' || run.event !== 'pull_request' ||
                !Number.isSafeInteger(run.repository?.id) || run.repository.id !== run.head_repository?.id ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('Expected a same-repository PR CI run');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            if (run.head_sha !== context.payload.pull_request.head.sha) throw new Error('Source run head differs from event');
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== run.head_sha ||
                pr.head.repo?.id !== run.repository.id || pr.base.repo?.id !== run.repository.id) {
              core.notice('This run no longer represents the live PR head.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id, filter: 'all',
            });
            const successful = jobs.filter(job =>
              job.run_id === run_id && job.name === 'PR preview package' &&
              Number.isSafeInteger(job.run_attempt) && job.run_attempt > 0 && job.run_attempt <= run.run_attempt &&
              job.conclusion === 'success' &&
              job.steps?.some(step => step.name === 'Upload verified preview' && step.conclusion === 'success'),
            );
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id,
            });
            // GitHub can roll forward an upstream job record on a downstream-only rerun.
            // The new job record has no upload of its own, so select the actual artifact.
            const attempts = [...new Set(successful.map(job => job.run_attempt))].sort((a, b) => b - a);
            for (const attempt of attempts) {
              const name = `pr-preview-${pr.number}-${run.head_sha}-attempt-${attempt}`;
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              if (matches.length === 0) continue;
              if (matches.length !== 1 || successful.filter(job => job.run_attempt === attempt).length !== 1) {
                throw new Error('Ambiguous successful preview archive');
              }
              core.setOutput('pr', pr.number);
              core.setOutput('head', run.head_sha);
              core.setOutput('attempt', attempt);
              core.setOutput('artifact', matches[0].id);
              return;
            }
            throw new Error('No unexpired archive from a successful preview upload');
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.source.outputs.artifact != ''
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/comment-preview
          merge-multiple: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: steps.source.outputs.artifact != ''
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          PR_HEAD: ${{ steps.source.outputs.head }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          PACKAGING_ATTEMPT: ${{ steps.source.outputs.attempt }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { createHash } = require('node:crypto');
            const { owner, repo } = context.repo;
            const { PR_NUMBER, PR_HEAD, ARTIFACT_ID, PACKAGING_ATTEMPT, SOURCE_RUN_ID } = process.env;
            const issue_number = Number(PR_NUMBER);
            const marker = '<!-- pr-installable-preview -->';
            const directory = path.join(process.env.RUNNER_TEMP, 'comment-preview');
            const receipt = JSON.parse(fs.readFileSync(path.join(directory, 'receipt.json'), 'utf8'));
            if (receipt.pr !== PR_NUMBER || receipt.head !== PR_HEAD ||
                receipt.runId !== SOURCE_RUN_ID || receipt.attempt !== PACKAGING_ATTEMPT ||
                receipt.name !== 'gh-address-cr' ||
                !/^gh_address_cr-[a-z0-9.+!]+-[a-z0-9_-]+\.whl$/.test(receipt.file)) {
              throw new Error('Downloaded receipt does not match the PR wheel');
            }
            const bytes = fs.readFileSync(path.join(directory, receipt.file));
            if (createHash('sha256').update(bytes).digest('hex') !== receipt.sha256) {
              throw new Error('Downloaded wheel checksum does not match');
            }
            const panel = fs.readFileSync(path.join(directory, 'card.md'), 'utf8');
            const body = marker + '\n' + panel.replaceAll('99999999999999', ARTIFACT_ID);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker + '\n'));
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== PR_HEAD ||
                pr.head.repo?.id !== pr.base.repo?.id) {
              core.notice('The PR head changed before the card could be written.');
              return;
            }
            if (existing?.body === body) return;
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
