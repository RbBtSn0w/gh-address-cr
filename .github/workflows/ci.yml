name: Checks / Python
run-name: >-
  Checks / Python / ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} / ${{ github.event_name }}

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      - fix/**
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

# CI smoke runs exercise the installed CLI against placeholder repos without gh
# auth. Route their spans to the development Gateway so synthetic failures never
# reach the production dataset or its alerts.
env:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://telemetry-gateway-development.hamiltonsnow.workers.dev/v1/traces

jobs:
  validate-base:
    if: github.event_name == 'pull_request'
    permissions: {}
    name: Validate base branch
    runs-on: ubuntu-latest
    steps:
      - name: Check target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${BASE_REF}" = "main" ]; then
            if [ "${HEAD_REF}" = "develop" ]; then
              echo "Allowing release PR: develop -> main"
              exit 0
            fi
            echo "::error::PRs directly targeting 'main' are not allowed. Please change the base branch to 'develop'."
            exit 1
          fi
          echo "Base branch '${BASE_REF}' is allowed."

  lint-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint dependencies
        run: python -m pip install --upgrade pip ruff build coverage mypy

      - name: Install project
        run: python -m pip install -e .

      - name: Ruff
        run: ruff check src tests scripts/build_plugin_payload.py scripts/release

      - name: Mypy (blocking)
        run: python3 scripts/check_mypy_ratchet.py

      - name: Unit tests (with coverage)
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report

      - name: Generate plugin payload
        run: python scripts/build_plugin_payload.py --output dist/plugin/gh-address-cr

      - name: CLI smoke
        env:
          PYTHONPATH: src
        run: |
          python -m gh_address_cr --help
          python -m gh_address_cr review --help
          python -m gh_address_cr agent manifest

          set +e
          output="$(python -m gh_address_cr cr-loop --help 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          printf '%s\n' "$output" | grep -qi "Unknown command"

      - name: Package build
        run: |
          rm -rf dist build
          python -m build

      - name: Package install
        run: |
          python -m venv .venv-package-smoke
          . .venv-package-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Installed CLI smoke
        run: |
          . .venv-package-smoke/bin/activate
          gh-address-cr --help
          python -m gh_address_cr --help
          gh-address-cr agent manifest

          run_domain_smoke() {
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -E 'Traceback|ModuleNotFoundError|No module named|command not found'; then
              exit 1
            fi
            if [ "$status" -ne 0 ] && ! printf '%s\n' "$output" | grep -E '"status"|"reason_code"|SESSION|session|missing|Final gate failed to evaluate|error connecting to api.github.com|check your internet connection'; then
              exit 1
            fi
          }

          run_domain_smoke gh-address-cr agent orchestrate status owner/repo 123
          run_domain_smoke gh-address-cr final-gate owner/repo 123

      - name: Installed wheel agent journey
        # Spec 039 L2: run the agent journey contract against the built wheel, not
        # src/, so packaging drift (missing package data, entry points) fails here.
        run: |
          . .venv-package-smoke/bin/activate
          python - <<'PY'
          import gh_address_cr

          assert "site-packages" in gh_address_cr.__file__, gh_address_cr.__file__
          PY
          python -m unittest tests.contract.test_agent_journey_contract

  otel-minimum-versions:
    # lint-and-test resolves the newest OpenTelemetry release, so it can never notice that
    # pyproject.toml allows versions lacking a semantic-conventions constant the code
    # imports. This job installs the declared lower bounds and runs the tests against them.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin OpenTelemetry to the lower bounds declared in pyproject.toml
        # Fails on any opentelemetry-* spec it cannot turn into an exact pin, so the job can
        # never silently fall back to testing the newest release.
        run: |
          python scripts/otel_min_constraints.py > otel-min-constraints.txt
          cat otel-min-constraints.txt

      - name: Install project at the OpenTelemetry minimum versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c otel-min-constraints.txt -e .

      - name: Verify the installed OpenTelemetry versions are the declared floors
        run: python scripts/otel_min_constraints.py --check-installed

      - name: Unit tests at the minimum versions
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

  pr-dev-preview:
    name: Build PR Dev Preview
    needs: [lint-and-test, otel-minimum-versions]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'develop'
    concurrency:
      group: pr-dev-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head without publication credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade build packaging

      - name: Prepare Dev Version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          base = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          pr = int(os.environ["PR_NUMBER"])
          head = os.environ["PR_HEAD_SHA"]
          version = f"{base}.dev{pr}+{head[:7]}"
          subprocess.run([sys.executable, "scripts/set_package_version.py", "--version", version], check=True)
          Path("preview.json").write_text(json.dumps({
              "pr": pr, "head_sha": head, "version": version,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PYTHON

      - name: Build Python Package
        run: python -m build

      - name: Bind immutable source artifact
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path

          meta = json.loads(Path("preview.json").read_text())
          sources = list(Path("dist").glob("*.tar.gz"))
          if len(sources) != 1:
              raise SystemExit("expected exactly one source distribution")
          name = (f"gh-address-cr-pr{meta['pr']}-{meta['head_sha']}-"
                  f"{meta['run_id']}-{meta['run_attempt']}.tar.gz")
          source = sources[0].rename(Path("dist") / name)
          meta.update(source_name=name, source_sha256=hashlib.sha256(source.read_bytes()).hexdigest())
          Path("dist/preview.json").write_text(json.dumps(meta, sort_keys=True) + "\n")
          PYTHON

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gh-address-cr-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/preview.json
          retention-days: 14
