name: Checks / Python
run-name: >-
  Checks / Python / ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} / ${{ github.event_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Metadata only: never check out PR code or grant credentials for this event.
  pull_request_target:
    types: [edited]
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

# CI smoke runs exercise the installed CLI against placeholder repos without gh
# auth. Route their spans to the development Gateway so synthetic failures never
# reach the production dataset or its alerts.
env:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://telemetry-gateway-development.hamiltonsnow.workers.dev/v1/traces

jobs:
  validate-base:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    permissions: {}
    name: Validate base branch
    runs-on: ubuntu-latest
    steps:
      - name: Check target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$BASE_REF" = main || { echo "::error::Task PRs must target main"; exit 1; }

  lint-and-test:
    if: github.event_name != 'pull_request_target'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint dependencies
        run: python -m pip install --upgrade pip ruff build coverage mypy 'PyYAML>=6'

      - name: Install project
        run: python -m pip install -e .

      - name: Capture tested PR revision
        if: github.event_name == 'pull_request'
        run: >-
          python -m scripts.release.branch_validation capture
          --source lint-and-test-${{ matrix.python-version }}
          --output branch-validation/context.json

      - name: Setup release analyzer test runtime
        if: matrix.python-version == '3.14'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select npm 12 for release contract checks
        if: matrix.python-version == '3.14'
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install locked release tools
        if: matrix.python-version == '3.14'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the actual release contract
        id: release_contracts
        if: matrix.python-version == '3.14'
        env:
          RELEASE_TOOLS: ${{ github.workspace }}
        run: |
          node --version
          npm --version
          node .github/release-train/sync.mjs check --consumer .
          node .github/release-train/pipeline-contract.mjs check
          node .github/release-train/cadence.mjs check
      - name: Run release regressions
        if: matrix.python-version == '3.14'
        env:
          RELEASE_TOOLS: ${{ github.workspace }}
        run: npm run test:release

      - name: Ruff
        run: ruff check src tests scripts/build_plugin_payload.py scripts/release

      - name: Mypy (blocking)
        run: python3 scripts/check_mypy_ratchet.py

      - name: Unit tests (with coverage)
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report

      - name: Generate plugin payload
        run: python scripts/build_plugin_payload.py --output dist/plugin/gh-address-cr

      - name: CLI smoke
        env:
          PYTHONPATH: src
        run: |
          python -m gh_address_cr --help
          python -m gh_address_cr review --help
          python -m gh_address_cr agent manifest

          set +e
          output="$(python -m gh_address_cr cr-loop --help 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          printf '%s\n' "$output" | grep -qi "Unknown command"

      - name: Package build
        run: |
          rm -rf dist build
          python -m build

      - name: Package install
        run: |
          python -m venv .venv-package-smoke
          . .venv-package-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Installed CLI smoke
        env:
          GH_ADDRESS_CR_TEST_RUNTIME: installed
        run: |
          . .venv-package-smoke/bin/activate
          gh-address-cr --help
          python -m gh_address_cr --help
          gh-address-cr agent manifest

          python -m unittest tests.contract.test_installed_runtime_smoke_contract

      - name: Installed wheel agent journey
        env:
          GH_ADDRESS_CR_TEST_RUNTIME: installed
        # Spec 039 L2: run the agent journey contract against the built wheel, not
        # src/, so packaging drift (missing package data, entry points) fails here.
        run: |
          . .venv-package-smoke/bin/activate
          python -m unittest tests.contract.test_agent_journey_contract

      - name: Upload tested PR revision
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: branch-validation-source-${{ github.run_id }}-${{ github.run_attempt }}-lint-and-test-${{ matrix.python-version }}
          path: branch-validation/context.json
          if-no-files-found: error
          retention-days: 14

  otel-minimum-versions:
    if: github.event_name != 'pull_request_target'
    # lint-and-test resolves the newest OpenTelemetry release, so it can never notice that
    # pyproject.toml allows versions lacking a semantic-conventions constant the code
    # imports. This job installs the declared lower bounds and runs the tests against them.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin OpenTelemetry to the lower bounds declared in pyproject.toml
        # Fails on any opentelemetry-* spec it cannot turn into an exact pin, so the job can
        # never silently fall back to testing the newest release.
        run: |
          python scripts/otel_min_constraints.py > otel-min-constraints.txt
          cat otel-min-constraints.txt

      - name: Install project at the OpenTelemetry minimum versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c otel-min-constraints.txt -e . 'PyYAML>=6'

      - name: Capture tested PR revision
        if: github.event_name == 'pull_request'
        run: >-
          python -m scripts.release.branch_validation capture
          --source otel-minimum-versions --output branch-validation/context.json

      - name: Verify the installed OpenTelemetry versions are the declared floors
        run: python scripts/otel_min_constraints.py --check-installed

      - name: Unit tests at the minimum versions
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Upload tested PR revision
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: branch-validation-source-${{ github.run_id }}-${{ github.run_attempt }}-otel-minimum-versions
          path: branch-validation/context.json
          if-no-files-found: error
          retention-days: 14

  record-pr-validation-context:
    name: Record PR validation context
    needs: [validate-base, lint-and-test, otel-minimum-versions]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation helper without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation helper
        run: |
          python -m venv .venv-validation
          .venv-validation/bin/python -m pip install -e .

      - name: Download tested revision receipts
        uses: actions/download-artifact@v4
        with:
          pattern: branch-validation-source-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: branch-validation-sources

      - name: Verify every mandatory job tested the same event merge
        run: >-
          .venv-validation/bin/python -m scripts.release.branch_validation aggregate
          --directory branch-validation-sources --output branch-validation/context.json

      - name: Upload immutable validation context
        uses: actions/upload-artifact@v4
        with:
          name: branch-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: branch-validation/context.json
          if-no-files-found: error
          retention-days: 90

  plugin-marketplace-smoke:
    name: Codex marketplace compatibility
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install . 'PyYAML>=6'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned official Codex CLI
        run: npm install --global --no-audit --no-fund @openai/codex@0.166.0

      - name: Exercise two-version marketplace installation in isolated Git
        run: python -m scripts.release.plugin_marketplace_smoke --codex "$(command -v codex)"

  pr-preview:
    name: PR preview package
    needs: [record-pr-validation-context, plugin-marketplace-smoke]
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build 'packaging>=24'
      - name: Pack and verify the exact PR head
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          preview="$RUNNER_TEMP/pr-preview"
          mkdir "$preview"
          version="$(python scripts/release/pr_preview.py version "$preview")"
          python scripts/set_package_version.py --version "$version"
          python -m build --wheel --outdir "$preview"
          python scripts/release/pr_preview.py seal "$preview" --version "$version"
          wheel="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["file"])' "$preview/receipt.json")"
          consumer="$(mktemp -d "$RUNNER_TEMP/preview-consumer.XXXXXX")"
          cp -R tests "$consumer/tests"
          # The existing negative test explicitly adds this path in its poisoned subprocess.
          ln -s "$GITHUB_WORKSPACE/src" "$consumer/src"
          (
            cd "$consumer"
            unset PYTHONPATH PYTHONHOME
            python -m venv venv
            venv/bin/python -m pip install "$preview/$wheel"
            test "$(venv/bin/gh-address-cr --version)" = "gh-address-cr $version"
            venv/bin/gh-address-cr --help
            GH_ADDRESS_CR_TEST_RUNTIME=installed venv/bin/python -m unittest \
              tests.contract.test_installed_runtime_smoke_contract tests.contract.test_agent_journey_contract
          )
          python scripts/release/pr_preview.py verify "$preview"
          ARTIFACT_ID=99999999999999 python scripts/release/pr_preview.py card "$preview" > "$preview/card.md"
      - name: Upload verified preview
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Show wheel verification commands
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: sed "s/99999999999999/$ARTIFACT_ID/g" "$RUNNER_TEMP/pr-preview/card.md" >> "$GITHUB_STEP_SUMMARY"

  pr-preview-comment:
    name: Update the PR preview card
    needs: pr-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-preview-card-${{ github.event.pull_request.number }}
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Locate the successful upload
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = Number(process.env.SOURCE_RUN_ID);
            if (!/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ID) || !Number.isSafeInteger(run_id)) {
              throw new Error('Invalid source run ID');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.path !== '.github/workflows/ci.yml' || run.event !== 'pull_request' ||
                run.repository?.id !== run.head_repository?.id ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('Expected a same-repository PR CI run');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            if (run.head_sha !== context.payload.pull_request.head.sha) throw new Error('Source run head differs from event');
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== run.head_sha ||
                pr.head.repo?.id !== run.repository.id || pr.base.repo?.id !== run.repository.id) {
              core.notice('This run no longer represents the live PR head.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id, filter: 'all',
            });
            const candidates = jobs.filter(job =>
              job.run_id === run_id && job.name === 'PR preview package' &&
              Number.isSafeInteger(job.run_attempt) && job.run_attempt > 0 && job.run_attempt <= run.run_attempt,
            ).sort((a, b) => b.run_attempt - a.run_attempt);
            const [job, duplicate] = candidates;
            if (job?.conclusion !== 'success' || duplicate?.run_attempt === job.run_attempt ||
                !job.steps.some(step => step.name === 'Upload verified preview' && step.conclusion === 'success')) {
              throw new Error('The latest packaging job did not successfully upload a preview');
            }
            const name = `pr-preview-${pr.number}-${run.head_sha}-attempt-${job.run_attempt}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id, name,
            });
            const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
            if (matches.length !== 1) throw new Error('Expected one unexpired preview artifact');
            core.setOutput('pr', pr.number);
            core.setOutput('head', run.head_sha);
            core.setOutput('attempt', job.run_attempt);
            core.setOutput('artifact', matches[0].id);
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.source.outputs.artifact != ''
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/comment-preview
          merge-multiple: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: steps.source.outputs.artifact != ''
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          PR_HEAD: ${{ steps.source.outputs.head }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          PACKAGING_ATTEMPT: ${{ steps.source.outputs.attempt }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { createHash } = require('node:crypto');
            const { owner, repo } = context.repo;
            const { PR_NUMBER, PR_HEAD, ARTIFACT_ID, PACKAGING_ATTEMPT, SOURCE_RUN_ID } = process.env;
            const issue_number = Number(PR_NUMBER);
            const marker = '<!-- pr-installable-preview -->';
            const directory = path.join(process.env.RUNNER_TEMP, 'comment-preview');
            const receipt = JSON.parse(fs.readFileSync(path.join(directory, 'receipt.json'), 'utf8'));
            if (receipt.pr !== PR_NUMBER || receipt.head !== PR_HEAD ||
                receipt.runId !== SOURCE_RUN_ID || receipt.attempt !== PACKAGING_ATTEMPT ||
                receipt.name !== 'gh-address-cr' ||
                !/^gh_address_cr-[a-z0-9.+!]+-[a-z0-9_-]+\.whl$/.test(receipt.file)) {
              throw new Error('Downloaded receipt does not match the PR wheel');
            }
            const bytes = fs.readFileSync(path.join(directory, receipt.file));
            if (createHash('sha256').update(bytes).digest('hex') !== receipt.sha256) {
              throw new Error('Downloaded wheel checksum does not match');
            }
            const panel = fs.readFileSync(path.join(directory, 'card.md'), 'utf8');
            const body = marker + '\n' + panel.replaceAll('99999999999999', ARTIFACT_ID);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker + '\n'));
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== PR_HEAD ||
                pr.head.repo?.id !== pr.base.repo?.id) {
              core.notice('The PR head changed before the card could be written.');
              return;
            }
            if (existing?.body === body) return;
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
