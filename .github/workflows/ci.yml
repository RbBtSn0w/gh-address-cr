name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint dependencies
        run: python -m pip install --upgrade pip ruff build coverage mypy

      - name: Install project
        run: python -m pip install -e .

      - name: Ruff
        run: ruff check src tests

      - name: Mypy (blocking)
        run: python3 scripts/check_mypy_ratchet.py

      - name: Unit tests (with coverage)
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report

      - name: Generate plugin payload
        run: python scripts/build_plugin_payload.py --output dist/plugin/gh-address-cr

      - name: CLI smoke
        env:
          PYTHONPATH: src
        run: |
          python -m gh_address_cr --help
          python -m gh_address_cr review --help
          python -m gh_address_cr agent manifest

          set +e
          output="$(python -m gh_address_cr cr-loop --help 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          printf '%s\n' "$output" | grep -qi "Unknown command"

      - name: Package build
        run: |
          rm -rf dist build
          python -m build

      - name: Package install
        run: |
          python -m venv .venv-package-smoke
          . .venv-package-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Installed CLI smoke
        run: |
          . .venv-package-smoke/bin/activate
          gh-address-cr --help
          python -m gh_address_cr --help
          gh-address-cr agent manifest

          run_domain_smoke() {
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -E 'Traceback|ModuleNotFoundError|No module named|command not found'; then
              exit 1
            fi
            if [ "$status" -ne 0 ] && ! printf '%s\n' "$output" | grep -E '"status"|"reason_code"|SESSION|session|missing|Final gate failed to evaluate|error connecting to api.github.com|check your internet connection'; then
              exit 1
            fi
          }

          run_domain_smoke gh-address-cr agent orchestrate status owner/repo 123
          run_domain_smoke gh-address-cr final-gate owner/repo 123

  pr-dev-preview:
    name: Publish PR Dev Preview
    needs: lint-and-test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build packaging requests

      - name: Prepare Dev Version
        id: versioning
        run: |
          BASE_VERSION="$(python3 -c 'import re; m = re.search(r"version = \"([^\"]+)\"", open("pyproject.toml").read()); print(m.group(1))')"
          PR_NUM="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          DEV_VERSION="${BASE_VERSION}.dev${PR_NUM}+${SHORT_SHA}"

          python3 scripts/set_package_version.py --version "${DEV_VERSION}"

          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"

      - name: Build Python Package
        run: |
          rm -rf dist build
          python -m build

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gh-address-cr-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14

      - name: Ensure pr-preview Release Exists and Upload Sdist
        id: release-upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.versioning.outputs.pr_number }}"
          SDIST_FILE="$(ls dist/*.tar.gz | head -n 1)"
          SDIST_ASSET_NAME="gh-address-cr-pr${PR_NUM}.tar.gz"
          cp "$SDIST_FILE" "$SDIST_ASSET_NAME"
          SHA256="$(sha256sum "$SDIST_ASSET_NAME" | awk '{print $1}')"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

          if ! gh release view pr-preview >/dev/null 2>&1; then
            echo "Creating rolling pr-preview release..."
            gh release create pr-preview \
              --title "PR Preview Builds" \
              --notes "Automated rolling release for PR dev preview builds." \
              --prerelease || true
          fi

          echo "Uploading ${SDIST_ASSET_NAME} to pr-preview release..."
          gh release upload pr-preview "$SDIST_ASSET_NAME" --clobber

          SDIST_URL="https://github.com/${{ github.repository }}/releases/download/pr-preview/${SDIST_ASSET_NAME}"
          echo "sdist_url=${SDIST_URL}" >> "$GITHUB_OUTPUT"

      - name: Render PR Homebrew Formula
        id: render-formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.versioning.outputs.pr_number }}"
          DEV_VERSION="${{ steps.versioning.outputs.dev_version }}"
          SDIST_URL="${{ steps.release-upload.outputs.sdist_url }}"
          SHA256="${{ steps.release-upload.outputs.sha256 }}"
          FORMULA_NAME="gh-address-cr-pr${PR_NUM}"
          FORMULA_FILE="${FORMULA_NAME}.rb"

          python3 scripts/release/render_homebrew_formula.py \
            --version "${DEV_VERSION}" \
            --sdist-url "${SDIST_URL}" \
            --sha256 "${SHA256}" \
            --formula-name "${FORMULA_NAME}" \
            --conflicts-with "gh-address-cr" \
            --output "${FORMULA_FILE}"

          echo "Uploading ${FORMULA_FILE} to pr-preview release..."
          gh release upload pr-preview "${FORMULA_FILE}" --clobber

          FORMULA_URL="https://github.com/${{ github.repository }}/releases/download/pr-preview/${FORMULA_FILE}"
          echo "formula_url=${FORMULA_URL}" >> "$GITHUB_OUTPUT"
          echo "formula_name=${FORMULA_NAME}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with Multi-Path Verification Instructions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const devVersion = '${{ steps.versioning.outputs.dev_version }}';
            const shortSha = '${{ steps.versioning.outputs.short_sha }}';
            const prNumber = '${{ steps.versioning.outputs.pr_number }}';
            const formulaName = '${{ steps.render-formula.outputs.formula_name }}';
            const formulaUrl = '${{ steps.render-formula.outputs.formula_url }}';
            const runId = context.runId;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            const marker = '<!-- pr-dev-preview-comment -->';
            const body = `${marker}
            ### 🚀 PR Dev Preview Ready
            
            A dev preview build for this PR has been compiled, packaged, and rendered!
            
            - **Dev Version**: \`${devVersion}\`
            - **Commit**: \`${shortSha}\`
            - **Workflow Run**: [#${runId}](https://github.com/${repoOwner}/${repoName}/actions/runs/${runId})
            
            ---
            
            #### 📦 Choose Your Installation & Validation Path
            
            #### Path 1: 🍺 Homebrew (Recommended for macOS)
            Load and test this PR's rendered standalone Formula directly in your tapped repository:
            
            \`\`\`bash
            # 1. Download formula to your local tap directory
            curl -sSL "${formulaUrl}" -o "$(brew --repository rbbtsn0w/tap)/Formula/${formulaName}.rb"
            
            # 2. Install (or reinstall) this PR dev build
            brew install rbbtsn0w/tap/${formulaName}
            # Or if updating:
            brew reinstall rbbtsn0w/tap/${formulaName}
            
            # 3. Verify installation
            gh-address-cr --version
            gh-address-cr agent manifest
            \`\`\`
            > **Note**: If you already have the stable formula linked, run \`brew unlink gh-address-cr\` first.
            
            ---
            
            #### Path 2: ⚡ \`pipx\` from PR Git Ref (Zero-Download Quick Validation)
            Install globally in an isolated environment directly from the PR's GitHub ref:
            
            \`\`\`bash
            pipx install --force git+https://github.com/${repoOwner}/${repoName}.git@refs/pull/${prNumber}/head
            gh-address-cr --version
            gh-address-cr agent manifest
            \`\`\`
            
            ---
            
            #### Path 3: 🐍 Download Pre-built Wheel (\`venv\` Sandbox Testing)
            Download the pre-compiled \`.whl\` artifact from this CI run into a temporary virtual environment:
            
            \`\`\`bash
            # 1. Download build artifacts using GitHub CLI
            gh run download ${runId} -n gh-address-cr-dist --dir /tmp/pr-${prNumber}-dist
            
            # 2. Create isolated venv and install wheel
            python3 -m venv /tmp/pr-${prNumber}-venv
            /tmp/pr-${prNumber}-venv/bin/pip install /tmp/pr-${prNumber}-dist/*.whl
            
            # 3. Test CLI runtime
            /tmp/pr-${prNumber}-venv/bin/gh-address-cr --version
            /tmp/pr-${prNumber}-venv/bin/gh-address-cr agent manifest
            \`\`\`
            
            ---
            
            #### 🧹 Cleanup Instructions
            - **Homebrew**: \`brew uninstall ${formulaName} && brew link gh-address-cr\`
            - **pipx**: \`pipx uninstall gh-address-cr\`
            - **venv**: \`rm -rf /tmp/pr-${prNumber}-dist /tmp/pr-${prNumber}-venv\`
            `;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: repoOwner,
                repo: repoName,
                issue_number: parseInt(prNumber, 10),
              });

              const botComment = comments.find(comment => 
                comment.body && comment.body.includes(marker)
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: repoOwner,
                  repo: repoName,
                  comment_id: botComment.id,
                  body: body,
                });
                console.log(`Updated existing preview comment ${botComment.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner: repoOwner,
                  repo: repoName,
                  issue_number: parseInt(prNumber, 10),
                  body: body,
                });
                console.log('Created new PR preview comment');
              }
            } catch (err) {
              core.warning(`Failed to create or update PR dev preview comment: ${err.message}`);
            }

