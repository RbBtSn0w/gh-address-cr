name: Recover Plugin Marketplace
run-name: Recover plugin marketplace / ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing stable GitHub Release version (X.Y.Z); never rebuilds assets"
        type: string
        required: true

permissions:
  contents: read

jobs:
  recover-plugin-marketplace:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: plugin-marketplace-publication
      cancel-in-progress: false
    steps:
      - name: Checkout trusted recovery implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install release helper
        run: python -m pip install . 'PyYAML>=6'

      - name: Recover existing assets and read back marketplace
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          python -m scripts.release.plugin_release recover
          --directory dist/plugin-release --version "$VERSION"
