name: Setup trusted release helper
description: Use current trusted source helpers with third-party binary dependencies only.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - shell: bash
      run: |
        python -m venv .release-venv
        python -c 'import tomllib; from pathlib import Path; print("\n".join(tomllib.loads(Path("pyproject.toml").read_text())["project"]["dependencies"]))' > "$RUNNER_TEMP/release-helper-requirements.txt"
        .release-venv/bin/python -m pip install --only-binary=:all: -r "$RUNNER_TEMP/release-helper-requirements.txt" 'PyYAML>=6'
        echo "$PWD/.release-venv/bin" >> "$GITHUB_PATH"
        echo "PYTHONPATH=$PWD/src" >> "$GITHUB_ENV"
